server {
    listen 80;
    listen [::]:80;

    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # SPA routing: fall through to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are safe to cache long-term.
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # PWA service worker and manifest must not be cached immutably,
    # otherwise updates never reach clients.
    location ~* ^/(sw\.js|workbox-.*\.js|registerSW\.js|manifest\.webmanifest|manifest\.json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}