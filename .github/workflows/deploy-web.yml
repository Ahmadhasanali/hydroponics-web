name: Deploy Web Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEMO_WEB_PATH: /home/deploy/project/hydroponic/demo/web
  DEMO_ROOT: /home/deploy/project/hydroponic/demo
  DEMO_COMPOSE_FILE: compose.yaml
  DEMO_SERVICE: demo-hydroponic-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host key
        run: ssh-keyscan ${{ secrets.HOME_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Check demo web env exists
        run: |
          ssh ${{ secrets.HOME_SERVER_USER }}@${{ secrets.HOME_SERVER_HOST }} \
            "test -f $DEMO_WEB_PATH/.env || (echo 'MISS: $DEMO_WEB_PATH/.env tidak ada (untracked, jangan di-commit). Buat dulu dari .env.example dengan VITE_API_URL demo + VITE_DEMO_MODE=true' && exit 1)"

      - name: Deploy demo web
        run: |
          ssh ${{ secrets.HOME_SERVER_USER }}@${{ secrets.HOME_SERVER_HOST }} \
            "cd $DEMO_WEB_PATH && git fetch --all && git reset --hard origin/main && cd $DEMO_ROOT && docker compose -f $DEMO_COMPOSE_FILE up -d --build $DEMO_SERVICE"
